        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });

      gtag('js', new Date());
      gtag('config', 'G-VDSJYFKB65', { anonymize_ip: true });
    </script>
